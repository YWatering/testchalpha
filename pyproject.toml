[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kline-retrieval"
version = "0.1.0"
description = "A multi-scale stock K-line retrieval and historical return analysis tool"
requires-python = ">=3.10"

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]
