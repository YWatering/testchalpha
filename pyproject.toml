[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kline-retrieval"
version = "0.1.0"
description = "A multi-scale stock K-line retrieval and historical return analysis tool"
requires-python = ">=3.10"

[project.scripts]
kline-download-a-share = "kline_retrieval.download_cli:main"
kline-refresh-a-share = "kline_retrieval.refresh_cli:main"
kline-build-database = "kline_retrieval.database_cli:main"
kline-import-csmar = "kline_retrieval.csmar_import:main"
kline-build-colproj-index = "kline_retrieval.index_cli:main"
kline-sync-instrument-names = "kline_retrieval.instrument_names:main"
kline-plan-a-share-batches = "kline_retrieval.universe_cli:main"
kline-publish-index-manifest = "kline_retrieval.index_manifest:main"
kline-build-next-index-batch = "kline_retrieval.batch_index_cli:main"
kline-train-cnn = "kline_retrieval.cnn_cli:train_main"
kline-evaluate-cnn = "kline_retrieval.cnn_cli:evaluate_main"

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx2",
]
a-share = [
    "akshare>=1.18.88,<2; python_version >= '3.11'",
]
cnn = [
    "torch>=2.4,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
